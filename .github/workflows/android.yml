name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          unzip -o Vimlesh-APK-Cloner-source.zip -d source
          ls source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: source/APK-Toolbox-main
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vimlesh-APK
          path: source/APK-Toolbox-main/app/build/outputs/apk/debug/*.apk
